<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹方块大逃亡 (Neon Square Escape)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            border: 2px solid #00ffff;
            box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        // ========================================
        // 霓虹方块大逃亡 (Neon Square Escape)
        // 纯原生 HTML5 Canvas + JavaScript 游戏
        // ========================================

        // ========================================
        // 【输入处理类】处理键盘事件
        // ========================================
        class InputHandler {
            constructor() {
                this.keys = {
                    up: false,
                    down: false,
                    left: false,
                    right: false,
                    space: false
                };
                this.spacePressed = false;
                this.init();
            }

            init() {
                document.addEventListener('keydown', (e) => {
                    switch(e.code) {
                        case 'ArrowUp':
                        case 'KeyW':
                            this.keys.up = true;
                            break;
                        case 'ArrowDown':
                        case 'KeyS':
                            this.keys.down = true;
                            break;
                        case 'ArrowLeft':
                        case 'KeyA':
                            this.keys.left = true;
                            break;
                        case 'ArrowRight':
                        case 'KeyD':
                            this.keys.right = true;
                            break;
                        case 'Space':
                            if (!this.spacePressed) {
                                this.keys.space = true;
                                this.spacePressed = true;
                            }
                            break;
                    }
                    e.preventDefault();
                });

                document.addEventListener('keyup', (e) => {
                    switch(e.code) {
                        case 'ArrowUp':
                        case 'KeyW':
                            this.keys.up = false;
                            break;
                        case 'ArrowDown':
                        case 'KeyS':
                            this.keys.down = false;
                            break;
                        case 'ArrowLeft':
                        case 'KeyA':
                            this.keys.left = false;
                            break;
                        case 'ArrowRight':
                        case 'KeyD':
                            this.keys.right = false;
                            break;
                        case 'Space':
                            this.keys.space = false;
                            this.spacePressed = false;
                            break;
                    }
                    e.preventDefault();
                });
            }

            resetSpace() {
                this.keys.space = false;
            }
        }

        // ========================================
        // 【实体基类】玩家和敌人的父类
        // ========================================
        class Entity {
            constructor(x, y, size, color) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.color = color;
                this.vx = 0;
                this.vy = 0;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
            }

            draw(ctx) {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 20;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }

            getBounds() {
                return {
                    left: this.x,
                    right: this.x + this.size,
                    top: this.y,
                    bottom: this.y + this.size
                };
            }
        }

        // ========================================
        // 【玩家类】继承自Entity
        // ========================================
        class Player extends Entity {
            constructor(x, y) {
                super(x, y, 30, '#00ffff');
                this.speed = 250;
            }

            update(dt, keys, canvasWidth, canvasHeight) {
                this.vx = 0;
                this.vy = 0;

                if (keys.up) this.vy = -this.speed;
                if (keys.down) this.vy = this.speed;
                if (keys.left) this.vx = -this.speed;
                if (keys.right) this.vx = this.speed;

                if (this.vx !== 0 && this.vy !== 0) {
                    this.vx *= 0.707;
                    this.vy *= 0.707;
                }

                super.update(dt);

                if (this.x < 0) this.x = 0;
                if (this.x + this.size > canvasWidth) this.x = canvasWidth - this.size;
                if (this.y < 0) this.y = 0;
                if (this.y + this.size > canvasHeight) this.y = canvasHeight - this.size;
            }

            draw(ctx) {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 30;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ffffff';
                ctx.strokeRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        // ========================================
        // 【敌人类】继承自Entity，会追踪玩家
        // ========================================
        class Enemy extends Entity {
            constructor(x, y, speed) {
                super(x, y, 25, '#ff0044');
                this.speed = speed;
            }

            update(dt, playerX, playerY) {
                const dx = playerX - this.x;
                const dy = playerY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 0) {
                    this.vx = (dx / distance) * this.speed;
                    this.vy = (dy / distance) * this.speed;
                }

                super.update(dt);
            }

            draw(ctx) {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 25;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.strokeStyle = '#ff6688';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff6688';
                ctx.strokeRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        // ========================================
        // 【渲染系统】封装绘图上下文
        // ========================================
        class Renderer {
            constructor(ctx, width, height) {
                this.ctx = ctx;
                this.width = width;
                this.height = height;
            }

            clear() {
                this.ctx.fillStyle = '#0a0a0f';
                this.ctx.fillRect(0, 0, this.width, this.height);
                this.drawGrid();
            }

            drawGrid() {
                this.ctx.save();
                this.ctx.strokeStyle = 'rgba(0, 255, 255, 0.1)';
                this.ctx.lineWidth = 1;

                const gridSize = 50;
                for (let x = 0; x <= this.width; x += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.height);
                    this.ctx.stroke();
                }
                for (let y = 0; y <= this.height; y += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.width, y);
                    this.ctx.stroke();
                }
                this.ctx.restore();
            }

            drawText(text, x, y, options = {}) {
                const {
                    color = '#00ffff',
                    fontSize = 24,
                    align = 'center',
                    glow = true
                } = options;

                this.ctx.save();
                this.ctx.font = `bold ${fontSize}px 'Segoe UI', Arial, sans-serif`;
                this.ctx.textAlign = align;
                this.ctx.textBaseline = 'middle';
                this.ctx.fillStyle = color;
                
                if (glow) {
                    this.ctx.shadowColor = color;
                    this.ctx.shadowBlur = 20;
                }

                this.ctx.fillText(text, x, y);
                this.ctx.restore();
            }

            drawGlowingSquare(x, y, size, color, glowIntensity = 20) {
                this.ctx.save();
                this.ctx.fillStyle = color;
                this.ctx.shadowColor = color;
                this.ctx.shadowBlur = glowIntensity;
                this.ctx.fillRect(x, y, size, size);
                this.ctx.restore();
            }
        }

        // ========================================
        // 【游戏状态枚举】有限状态机的状态定义
        // ========================================
        const GameState = {
            MENU: 'MENU',
            PLAYING: 'PLAYING',
            GAME_OVER: 'GAME_OVER'
        };

        // ========================================
        // 【主游戏类】管理全局状态和游戏循环
        // ========================================
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.canvas.width = 800;
                this.canvas.height = 600;

                this.renderer = new Renderer(this.ctx, this.canvas.width, this.canvas.height);
                this.input = new InputHandler();

                this.state = GameState.MENU;
                this.player = null;
                this.enemies = [];
                this.score = 0;
                this.survivalTime = 0;
                this.enemySpawnTimer = 0;
                this.enemySpawnInterval = 2;
                this.baseEnemySpeed = 80;
                this.lastTime = 0;

                this.init();
            }

            init() {
                this.reset();
                requestAnimationFrame((time) => this.gameLoop(time));
            }

            reset() {
                this.player = new Player(
                    this.canvas.width / 2 - 15,
                    this.canvas.height / 2 - 15
                );
                this.enemies = [];
                this.score = 0;
                this.survivalTime = 0;
                this.enemySpawnTimer = 0;
                this.enemySpawnInterval = 2;
                this.baseEnemySpeed = 80;
            }

            // ========================================
            // 【游戏循环】使用 requestAnimationFrame 驱动
            // 实现基于时间增量 (Delta Time) 的更新机制
            // ========================================
            gameLoop(currentTime) {
                const dt = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;

                if (dt > 0.1) {
                    requestAnimationFrame((time) => this.gameLoop(time));
                    return;
                }

                this.update(dt);
                this.draw();

                requestAnimationFrame((time) => this.gameLoop(time));
            }

            // ========================================
            // 【更新逻辑】根据当前状态执行不同的更新
            // 严格分离 update(dt) 和 draw()
            // ========================================
            update(dt) {
                switch (this.state) {
                    case GameState.MENU:
                        this.updateMenu();
                        break;
                    case GameState.PLAYING:
                        this.updatePlaying(dt);
                        break;
                    case GameState.GAME_OVER:
                        this.updateGameOver();
                        break;
                }
            }

            updateMenu() {
                if (this.input.keys.space) {
                    this.state = GameState.PLAYING;
                    this.reset();
                    this.input.resetSpace();
                }
            }

            updatePlaying(dt) {
                this.survivalTime += dt;
                this.score = Math.floor(this.survivalTime * 10);

                this.player.update(
                    dt,
                    this.input.keys,
                    this.canvas.width,
                    this.canvas.height
                );

                const playerCenterX = this.player.x + this.player.size / 2;
                const playerCenterY = this.player.y + this.player.size / 2;

                for (const enemy of this.enemies) {
                    enemy.update(dt, playerCenterX, playerCenterY);
                }

                if (this.checkCollisions()) {
                    this.state = GameState.GAME_OVER;
                    return;
                }

                this.enemySpawnTimer += dt;
                const currentSpawnInterval = Math.max(0.5, this.enemySpawnInterval - this.survivalTime * 0.05);
                
                if (this.enemySpawnTimer >= currentSpawnInterval) {
                    this.spawnEnemy();
                    this.enemySpawnTimer = 0;
                }
            }

            updateGameOver() {
                if (this.input.keys.space) {
                    this.state = GameState.PLAYING;
                    this.reset();
                    this.input.resetSpace();
                }
            }

            // ========================================
            // 【AABB碰撞检测算法】
            // 轴对齐包围盒 (Axis-Aligned Bounding Box)
            // 检测两个矩形是否重叠
            // ========================================
            checkCollisions() {
                const playerBounds = this.player.getBounds();

                for (const enemy of this.enemies) {
                    const enemyBounds = enemy.getBounds();

                    if (this.checkAABBCollision(playerBounds, enemyBounds)) {
                        return true;
                    }
                }
                return false;
            }

            checkAABBCollision(a, b) {
                return !(
                    a.right < b.left ||
                    a.left > b.right ||
                    a.bottom < b.top ||
                    a.top > b.bottom
                );
            }

            spawnEnemy() {
                const side = Math.floor(Math.random() * 4);
                let x, y;
                const margin = 50;

                switch (side) {
                    case 0:
                        x = Math.random() * this.canvas.width;
                        y = -margin;
                        break;
                    case 1:
                        x = this.canvas.width + margin;
                        y = Math.random() * this.canvas.height;
                        break;
                    case 2:
                        x = Math.random() * this.canvas.width;
                        y = this.canvas.height + margin;
                        break;
                    case 3:
                        x = -margin;
                        y = Math.random() * this.canvas.height;
                        break;
                }

                const speedIncrease = Math.min(this.survivalTime * 2, 120);
                const enemySpeed = this.baseEnemySpeed + speedIncrease;

                this.enemies.push(new Enemy(x, y, enemySpeed));
            }

            // ========================================
            // 【渲染绘制】根据当前状态渲染不同界面
            // ========================================
            draw() {
                this.renderer.clear();

                switch (this.state) {
                    case GameState.MENU:
                        this.drawMenu();
                        break;
                    case GameState.PLAYING:
                        this.drawPlaying();
                        break;
                    case GameState.GAME_OVER:
                        this.drawGameOver();
                        break;
                }
            }

            drawMenu() {
                this.renderer.drawText('霓虹方块大逃亡', this.canvas.width / 2, 180, {
                    color: '#00ffff',
                    fontSize: 48,
                    glow: true
                });

                this.renderer.drawText('Neon Square Escape', this.canvas.width / 2, 240, {
                    color: '#00ffff',
                    fontSize: 28,
                    glow: true
                });

                this.drawPulsingText('按 空格键 开始游戏', this.canvas.width / 2, 350, {
                    color: '#ffffff',
                    fontSize: 24
                });

                this.renderer.drawText('使用 方向键 或 WASD 移动', this.canvas.width / 2, 450, {
                    color: '#888888',
                    fontSize: 18,
                    glow: false
                });

                this.renderer.drawText('躲避红色方块，存活越久分数越高', this.canvas.width / 2, 480, {
                    color: '#888888',
                    fontSize: 18,
                    glow: false
                });

                this.drawDemoPlayer();
            }

            drawPulsingText(text, x, y, options) {
                const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
                this.ctx.save();
                this.ctx.globalAlpha = pulse;
                this.renderer.drawText(text, x, y, options);
                this.ctx.restore();
            }

            drawDemoPlayer() {
                const time = Date.now() / 1000;
                const x = this.canvas.width / 2 - 15 + Math.sin(time * 2) * 50;
                const y = 300;

                this.ctx.save();
                this.ctx.fillStyle = '#00ffff';
                this.ctx.shadowColor = '#00ffff';
                this.ctx.shadowBlur = 30;
                this.ctx.fillRect(x, y, 30, 30);
                this.ctx.restore();
            }

            drawPlaying() {
                for (const enemy of this.enemies) {
                    enemy.draw(this.ctx);
                }

                this.player.draw(this.ctx);

                this.renderer.drawText(`得分: ${this.score}`, 80, 30, {
                    color: '#00ffff',
                    fontSize: 24,
                    align: 'left',
                    glow: true
                });

                this.renderer.drawText(`时间: ${this.survivalTime.toFixed(1)}s`, this.canvas.width - 80, 30, {
                    color: '#00ffff',
                    fontSize: 24,
                    align: 'right',
                    glow: true
                });

                this.renderer.drawText(`敌人: ${this.enemies.length}`, this.canvas.width / 2, 30, {
                    color: '#ff0044',
                    fontSize: 20,
                    glow: true
                });
            }

            drawGameOver() {
                for (const enemy of this.enemies) {
                    enemy.draw(this.ctx);
                }

                this.ctx.save();
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.restore();

                this.renderer.drawText('游戏结束', this.canvas.width / 2, 180, {
                    color: '#ff0044',
                    fontSize: 56,
                    glow: true
                });

                this.renderer.drawText('GAME OVER', this.canvas.width / 2, 240, {
                    color: '#ff0044',
                    fontSize: 28,
                    glow: true
                });

                this.renderer.drawText(`最终得分: ${this.score}`, this.canvas.width / 2, 320, {
                    color: '#00ffff',
                    fontSize: 36,
                    glow: true
                });

                this.renderer.drawText(`存活时间: ${this.survivalTime.toFixed(1)} 秒`, this.canvas.width / 2, 370, {
                    color: '#ffffff',
                    fontSize: 24,
                    glow: true
                });

                this.drawPulsingText('按 空格键 重新开始', this.canvas.width / 2, 480, {
                    color: '#ffffff',
                    fontSize: 24
                });
            }
        }

        // 页面加载完成后自动初始化游戏
        window.addEventListener('load', () => {
            new Game();
        });
    </script>
</body>
</html>
